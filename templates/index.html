<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OCR + GPT</title>
  <meta name="color-scheme" content="light dark">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="bg" aria-hidden="true">
    <span class="blob blob-a"></span>
    <span class="blob blob-b"></span>
    <span class="blob blob-c"></span>
  </div>

  <header class="header">
    <div class="container header-inner">
      <a class="brand" href="/">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 7V5a1 1 0 0 1 1-1h2M17 4h2a1 1 0 0 1 1 1v2M20 17v2a1 1 0 0 1-1 1h-2M7 20H5a1 1 0 0 1-1-1v-2M8 9h8M8 12h8M8 15h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </span>
        <span>OCR<span class="brand-dot">·</span>GPT</span>
      </a>
      <div class="header-actions">
        <div class="lang" role="group" aria-label="Language">
          <button type="button" class="lang-btn" data-lang="en">EN</button>
          <button type="button" class="lang-btn" data-lang="fr">FR</button>
        </div>
        <button type="button" class="icon-btn" id="theme-toggle" data-i18n-aria="theme">
          <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <span class="eyebrow reveal" style="--i:0" data-i18n="eyebrow"></span>
      <h1 class="reveal" style="--i:1"><span data-i18n="title1"></span> <span class="gradient-text" data-i18n="title2"></span></h1>
      <p class="lead reveal" style="--i:2" data-i18n="lead"></p>

      <ol class="steps reveal" style="--i:3" id="steps">
        <li class="step" data-step="upload"><span class="step-dot">1</span><span data-i18n="stepUpload"></span></li>
        <li class="step-line" aria-hidden="true"></li>
        <li class="step" data-step="ocr"><span class="step-dot">2</span><span>PaddleOCR</span></li>
        <li class="step-line" aria-hidden="true"></li>
        <li class="step" data-step="llm"><span class="step-dot">3</span><span>GPT</span></li>
      </ol>
    </section>

    <section class="workspace">
      <form id="form" class="card upload-card reveal" style="--i:4" novalidate>
        <h2 class="card-title" data-i18n="uploadTitle"></h2>

        <label class="dropzone" id="dropzone">
          <input type="file" name="image" id="file" accept="image/*,application/pdf" hidden>
          <div class="dz-empty" id="dz-empty">
            <span class="dz-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="28" height="28"><path d="M12 16V4m0 0-4 4m4-4 4 4M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </span>
            <strong data-i18n="dropTitle"></strong>
            <span class="muted" data-i18n="dropHint"></span>
          </div>
          <div class="dz-file" id="dz-file" hidden>
            <div class="thumb" id="thumb"></div>
            <div class="file-meta">
              <strong id="file-name"></strong>
              <span class="muted" id="file-size"></span>
            </div>
            <button type="button" class="icon-btn remove" id="remove" data-i18n-aria="remove">
              <svg viewBox="0 0 24 24" width="16" height="16"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            </button>
          </div>
        </label>
        <p class="field-error" id="field-error" role="alert"></p>

        <button type="submit" class="btn-primary" id="submit">
          <span class="spinner" aria-hidden="true"></span>
          <span class="btn-label" data-i18n="run"></span>
        </button>
        <p class="wait-hint" id="wait-hint" hidden data-i18n="waitHint"></p>
      </form>

      <section class="card result-card reveal" style="--i:5" aria-live="polite">
        <div class="card-head">
          <h2 class="card-title" data-i18n="resultTitle"></h2>
          <span class="badge" id="badge" hidden>
            <svg viewBox="0 0 24 24" width="14" height="14"><path class="check-path" d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span data-i18n="done"></span>
          </span>
        </div>

        <div class="empty" id="empty">
          <span class="empty-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="30" height="30"><path d="M7 3h7l5 5v11a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z M14 3v5h5 M9 13h6 M9 17h4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          <p data-i18n="emptyText"></p>
        </div>

        <div class="skeleton" id="skeleton" hidden>
          <div class="sk-row"></div>
          <div class="sk-row"></div>
        </div>

        <div class="fields" id="fields" hidden>
          <div class="field field-sender" style="--i:0">
            <span class="field-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="20" height="20"><path d="M3 21h18M5 21V8l7-5 7 5v13M9 21v-6h6v6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </span>
            <div class="field-body">
              <span class="field-label" data-i18n="sender"></span>
              <span class="field-value" id="sender"></span>
            </div>
            <button type="button" class="icon-btn copy" data-copy="sender" data-i18n-aria="copy">
              <svg viewBox="0 0 24 24" width="16" height="16"><rect x="9" y="9" width="11" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8" fill="none" stroke="currentColor" stroke-width="2"/></svg>
            </button>
          </div>
          <div class="field field-amount" style="--i:1">
            <span class="field-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="20" height="20"><rect x="2" y="6" width="20" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/></svg>
            </span>
            <div class="field-body">
              <span class="field-label" data-i18n="amount"></span>
              <span class="field-value" id="amount"></span>
            </div>
            <button type="button" class="icon-btn copy" data-copy="amount" data-i18n-aria="copy">
              <svg viewBox="0 0 24 24" width="16" height="16"><rect x="9" y="9" width="11" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8" fill="none" stroke="currentColor" stroke-width="2"/></svg>
            </button>
          </div>
        </div>
      </section>
    </section>

    <section class="how">
      <h2 class="section-title reveal-scroll" data-i18n="howTitle"></h2>
      <div class="how-grid">
        <article class="how-card reveal-scroll" style="--i:0">
          <span class="how-num">01</span>
          <h3 data-i18n="how1Title"></h3>
          <p data-i18n="how1Text"></p>
        </article>
        <article class="how-card reveal-scroll" style="--i:1">
          <span class="how-num">02</span>
          <h3 data-i18n="how2Title"></h3>
          <p data-i18n="how2Text"></p>
        </article>
        <article class="how-card reveal-scroll" style="--i:2">
          <span class="how-num">03</span>
          <h3 data-i18n="how3Title"></h3>
          <p data-i18n="how3Text"></p>
        </article>
      </div>
    </section>
  </main>

  <footer class="footer container">
    <span data-i18n="footer"></span>
  </footer>

  <div class="toast" id="toast" role="status"></div>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
